# By URI for the live site; by DATABASE_ID plus the X-GraphQL-Preview header for previews.
query PageBy($id: ID!, $idType: PageIdType!) {
  page(id: $id, idType: $idType) {
    databaseId
    title
    uri
    isFrontPage
    seo {
      ...Seo
    }
    pageBuilder {
      ...PageBuilder
    }
  }
}

query PageUris {
  pages(first: 100, where: { status: PUBLISH }) {
    nodes {
      uri
    }
  }
}
