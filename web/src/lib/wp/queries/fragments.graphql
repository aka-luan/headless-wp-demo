fragment Media on MediaItem {
  sourceUrl
  altText
  mediaDetails {
    width
    height
  }
}

fragment Link on AcfLink {
  title
  url
  target
}

# Yoast data. Only query it on single nodes: in lists, the addon returns the first node's SEO for every item.
fragment Seo on PostTypeSEO {
  title
  metaDesc
  metaRobotsNoindex
  metaRobotsNofollow
  opengraphTitle
  opengraphDescription
  opengraphType
  opengraphPublishedTime
  opengraphModifiedTime
  opengraphImage {
    ...Media
  }
  twitterTitle
  twitterDescription
  twitterImage {
    sourceUrl
  }
  breadcrumbs {
    text
    url
  }
}

fragment TaxonomySeo on TaxonomySEO {
  title
  metaDesc
  metaRobotsNoindex
  metaRobotsNofollow
  opengraphTitle
  opengraphDescription
  opengraphImage {
    ...Media
  }
  breadcrumbs {
    text
    url
  }
}
