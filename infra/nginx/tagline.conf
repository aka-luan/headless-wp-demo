# Host nginx on the VPS: TLS for both hosts, proxied to the stack's Caddy on 127.0.0.1:8080.
# Install (certificate first, then this file):
#   sudo certbot certonly --nginx -d tagline.luanalves.com.br -d cms.tagline.luanalves.com.br
#   sudo cp infra/nginx/tagline.conf /etc/nginx/sites-available/tagline.luanalves.com.br
#   sudo ln -s /etc/nginx/sites-available/tagline.luanalves.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name tagline.luanalves.com.br cms.tagline.luanalves.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tagline.luanalves.com.br cms.tagline.luanalves.com.br;

    ssl_certificate /etc/letsencrypt/live/tagline.luanalves.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tagline.luanalves.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Matches upload_max_filesize in infra/php/uploads.ini.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, not append: the first X-Forwarded-For entry is what the contact form rate-limits on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
